# 场景 showcase：一轮类 Claude Code 的现场演示，停在权限询问上，回答后收尾。
name: showcase
seed: showcase
rules:
  - on: {answer: {prompt: pdemo}}
    then:
      - {after: 0, prompt_resolved: {session: $session, id: pdemo, resolution: answered}}
      - {after: 60, tool_started: {session: $session, id: s7, name: Bash}}
      - {after: 40, tool_input: {session: $session, id: s7, summary: "git push origin feature/oauth"}}
      - {after: 400, tool_finished: {session: $session, id: s7, content: "To github.com:acme/codix-svc.git\n * [new branch]      feature/oauth -> feature/oauth\nbranch 'feature/oauth' set up to track 'origin/feature/oauth'."}}
      - {after: 60, text_delta: {session: $session, text: "## 完成\n\n分支已推送，本轮改动如下：\n\n"}}
      - {after: 60, text_delta: {session: $session, text: "| 文件 | 改动 |\n|---|---|\n| `src/auth/oauth.rs` | 新增 provider |\n| `src/auth/mod.rs` | 暴露模块 |\n\n"}}
      - {after: 60, text_delta: {session: $session, text: "接下来可以改写 **登录与回调路由**。"}}
      - {after: 60, todos_changed: {session: $session, todos: [{text: 梳理现有认证入口, status: done}, {text: 调研 OAuth 库, status: done}, {text: 实现 OAuth provider, status: done}, {text: 改写登录与回调路由, status: done}, {text: 补齐集成测试, status: done}]}}
      - {after: 60, turn_ended: {session: $session, stop: end_turn, usage: {input: 24000, output: 1800}}}
  - on: submit
    once: true
    then:
      - {after: 0, play: turn}
scripts:
  turn:
    - {after: 0, turn_started: {session: $session}}
    - {after: 60, thinking_delta: {session: $session, text: "先把任务拆开，"}}
    - {after: 60, thinking_delta: {session: $session, text: "再读一遍 mod.rs 确认入口，"}}
    - {after: 60, thinking_delta: {session: $session, text: "改完跑测试后推分支。"}}
    - {after: 80, text_delta: {session: $session, text: "## 计划\n\n"}}
    - {after: 60, text_delta: {session: $session, text: "1. 读取 `src/auth/mod.rs`\n"}}
    - {after: 60, text_delta: {session: $session, text: "2. 接入 `OAuthProvider`\n"}}
    - {after: 60, text_delta: {session: $session, text: "3. 跑 `cargo test auth`\n"}}
    - {after: 80, tool_started: {session: $session, id: s1, name: TodoWrite}}
    - {after: 40, tool_input: {session: $session, id: s1, summary: "5 项"}}
    - {after: 60, tool_finished: {session: $session, id: s1, content: ""}}
    - {after: 0, todos_changed: {session: $session, todos: [{text: 梳理现有认证入口, status: done}, {text: 调研 OAuth 库, status: done}, {text: 实现 OAuth provider, status: in_progress}, {text: 改写登录与回调路由, status: pending}, {text: 补齐集成测试, status: pending}]}}
    - {after: 80, tool_started: {session: $session, id: s2, name: Read}}
    - {after: 40, tool_input: {session: $session, id: s2, summary: "src/auth/mod.rs"}}
    - {after: 100, tool_finished: {session: $session, id: s2, content: "use std::time::{Duration, SystemTime};\n\npub enum AuthError {\n    Expired,\n    BadSignature,\n    Empty,\n}\n\npub trait AuthProvider: Send + Sync {\n    fn authenticate(&self, token: &str) -> Result<Claims, AuthError>;\n}"}}
    - {after: 80, tool_started: {session: $session, id: s3, name: Bash}}
    - {after: 40, tool_input: {session: $session, id: s3, summary: "cargo test auth"}}
    - {after: 100, tool_progress: {session: $session, id: s3, message: "编译中……"}}
    - {after: 100, tool_progress: {session: $session, id: s3, message: "运行 12 个测试"}}
    - {after: 80, tool_finished: {session: $session, id: s3, content: "   Compiling codix-svc v0.3.0 (/work/codix)\n    Finished test target(s) in 3.12s\n     Running unittests src/lib.rs\n\nrunning 12 tests\ntest auth::tests::empty_token ... ok\ntest auth::tests::bad_signature ... ok\ntest auth::tests::expired ... ok\ntest auth::oauth::tests::introspect_ok ... ok\ntest auth::oauth::tests::pkce_verifier ... ok\ntest session::tests::new ... ok\ntest session::tests::expire ... ok\ntest api::tests::callback_ok ... ok\n\ntest result: ok. 12 passed; 0 failed"}}
    - {after: 80, tool_started: {session: $session, id: s4, name: Edit}}
    - {after: 40, tool_input: {session: $session, id: s4, summary: "src/auth/mod.rs"}}
    - {after: 100, tool_finished: {session: $session, id: s4, content: "ok", file_changes: [{path: src/auth/mod.rs, kind: modified, diff: "--- a/src/auth/mod.rs\n+++ b/src/auth/mod.rs\n@@ -1,4 +1,7 @@\n use std::time::{Duration, SystemTime};\n+\n+mod oauth;\n+pub use oauth::OAuthProvider;\n \n pub enum AuthError {\n     Expired,\n"}]}}
    - {after: 100, prompt_pending: {session: $session, prompt: {id: pdemo, kind: {permission: {tool: Bash, summary: "git push origin feature/oauth"}}}}}
