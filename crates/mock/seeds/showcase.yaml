flows:
  - summary: {name: feature-to-ship, title: 需求到上线, origin: builtin, active_runs: 2}
    stations:
      - {id: collect, title: 收集需求, work: session, status: pending}
      - {id: design, title: 设计, needs: [collect], work: session, status: pending}
      - {id: impl, title: 实现, needs: [design], work: agent × 2, status: pending}
      - {id: review, title: 评审, needs: [impl], work: confirm, status: pending}
      - {id: ship, title: 上线, needs: [review], work: "gate: ci", status: pending}
    yaml: |
      name: feature-to-ship
      title: 需求到上线
      inputs:
        subject: {type: string, description: 需求的一句话说明}
      stations:
        - id: collect
          title: 收集需求
          executor: {kind: session}
          skill: collect
          output: {type: object, required: [requirements]}
          exit: [{kind: output}]
        - id: design
          title: 设计
          needs: [collect]
          executor: {kind: session}
          skill: design
          output: {type: object, required: [plan]}
          exit: [{kind: output}]
        - id: impl
          title: 实现
          needs: [design]
          tasks:
            - {id: backend, executor: {kind: agent}, skill: impl-backend}
            - {id: frontend, executor: {kind: agent}, skill: impl-frontend}
          exit: [{kind: output}]
        - id: review
          title: 评审
          needs: [impl]
          exit: [{kind: confirm}]
        - id: ship
          title: 上线
          needs: [review]
          exit: [{kind: gate, gate: ci}]
  - summary: {name: weekly-report, title: 周报, origin: user, active_runs: 0}
    stations:
      - {id: collect, title: 收集, work: session, status: pending}
      - {id: summarize, title: 汇总, needs: [collect], work: session, status: pending}
      - {id: confirm, title: 待确认, needs: [summarize], work: confirm, status: pending}
    yaml: |
      name: weekly-report
      title: 周报
      stations:
        - id: collect
          title: 收集
          executor: {kind: session}
          skill: collect-tickets
          output: {type: object}
          exit: [{kind: output}]
        - id: summarize
          title: 汇总
          needs: [collect]
          executor: {kind: session}
          skill: summarize-week
          output: {type: object}
          exit: [{kind: output}]
        - id: confirm
          title: 待确认
          needs: [summarize]
          exit: [{kind: confirm}]

