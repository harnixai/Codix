            use std::time::{Duration, SystemTime};

            pub enum AuthError {
                Expired,
                BadSignature,
                Empty,
            }

            pub struct Claims {
                pub sub: String,
                pub exp: SystemTime,
            }

            pub trait AuthProvider: Send + Sync {
                fn authenticate(&self, token: &str) -> Result<Claims, AuthError>;
            }

            pub struct StaticProvider {
                secret: Vec<u8>,
            }

            impl AuthProvider for StaticProvider {
                fn authenticate(&self, token: &str) -> Result<Claims, AuthError> {
                    if token.is_empty() {
                        return Err(AuthError::Empty);
                    }
                    decode(token, &self.secret)
                }
            }

            pub fn verify_token(token: &str) -> bool {
                match decode(token, b"dev") {
                    Ok(claims) => claims.exp > SystemTime::now(),
                    Err(_) => false,
                }
            }

            fn decode(token: &str, secret: &[u8]) -> Result<Claims, AuthError> {
                let mut parts = token.split('.');
                let _header = parts.next().ok_or(AuthError::Empty)?;
                let body = parts.next().ok_or(AuthError::Empty)?;
                let sig = parts.next().ok_or(AuthError::Empty)?;
                if sig.len() < 8 || secret.is_empty() {
                    return Err(AuthError::BadSignature);
                }
                let exp = SystemTime::now() + Duration::from_secs(3600);
                Ok(Claims { sub: body.to_string(), exp })
            }
